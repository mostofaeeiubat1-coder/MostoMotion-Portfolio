<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MostoMotion - Professional Production</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00ff9d; 
            --primary: #7000ff;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020205;
            color: #ffffff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .header-font {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.01em;
        }
        .luxury-font {
            font-family: 'Playfair Display', serif;
        }
        
        /* Minimalist Glass Hover Effect for Legibility */
        .aura-hover {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            z-index: 1;
        }
        .aura-hover:hover {
            transform: translateY(-2px);
            color: var(--accent) !important;
            text-shadow: 0 0 15px rgba(0, 255, 157, 0.4);
        }
        /* Glass button style */
        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
            box-shadow: 0 8px 32px 0 rgba(0, 255, 157, 0.25);
            transform: translateY(-2px) scale(1.03);
        }
        .glass-btn:active {
            transform: translateY(1.5px) scale(0.97);
            box-shadow: 0 4px 16px 0 rgba(0, 255, 157, 0.1);
        }

        /* Standard button modifications for smooth hover and clicks */
        button {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        button:hover {
            transform: translateY(-2px) scale(1.05);
            filter: brightness(1.12);
        }
        button:active {
            transform: translateY(1.5px) scale(0.95);
            filter: brightness(0.9);
        }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            transition: all 0.5s ease;
        }
        
        .service-card {
            position: relative;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            overflow: hidden;
            border-radius: 2rem; /* Reduced from massive rounded values */
        }
        .service-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .glow-accent {
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.3);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #030308;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        @keyframes subtle-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-subtle-float {
            animation: subtle-float 4s ease-in-out infinite;
        }
    </style>
